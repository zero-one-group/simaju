services:
  app:
    build:
      context: ./docker/php
    container_name: simaju_app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db

  web:
    image: nginx:1.18
    container_name: simaju_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: simaju_db
    command: --default-authentication-plugin=mysql_native_password --sql-mode="" --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: simaju
      MYSQL_USER: simaju
      MYSQL_PASSWORD: simaju123
    ports:
      - "33060:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
